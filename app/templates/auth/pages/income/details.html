{% extends 'auth/pages/transaction_details_base.html' %}

{% block details_modal %}
    {% include 'auth/modals/income/edit.html' %}
{% endblock %}

{% block quick_actions %}
    <button type="button" class="btn btn-primary btn-block mb-2" data-toggle="modal" data-target="#editIncomeModal" data-income-api-url="{{ url_for('income.get_income_api', income_id=record.id) }}" data-income-update-url="{{ url_for('income.update_income_route', income_id=record.id) }}">
        <i class="bi bi-pencil"></i> Edit Income
    </button>
    <form method="POST" action="{{ url_for('income.delete_income_route', income_id=record.id) }}" class="d-inline w-100">
        <button type="submit" class="btn btn-danger btn-block" onclick="return confirm('Are you sure you want to delete this income record?');">
            <i class="bi bi-trash"></i> Delete Income
        </button>
    </form>
{% endblock %}
