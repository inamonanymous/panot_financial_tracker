{% extends 'auth/pages/transaction_details_base.html' %}

{% block details_modal %}
    {% include 'auth/modals/expense/edit.html' %}
{% endblock %}

{% block quick_actions %}
    <button type="button" class="btn btn-primary btn-block mb-2" data-toggle="modal" data-target="#editExpenseModal" data-expense-api-url="{{ url_for('expense.get_expense_api', expense_id=record.id) }}" data-expense-update-url="{{ url_for('expense.update_expense_route', expense_id=record.id) }}">
        <i class="bi bi-pencil"></i> Edit Expense
    </button>
    <form method="POST" action="{{ url_for('expense.delete_expense_route', expense_id=record.id) }}" class="d-inline w-100">
        <button type="submit" class="btn btn-danger btn-block" onclick="return confirm('Are you sure you want to delete this expense record?');">
            <i class="bi bi-trash"></i> Delete Expense
        </button>
    </form>
{% endblock %}
