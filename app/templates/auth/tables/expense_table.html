<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">My Expenses</h6>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Name</th>
                        <th>Payee</th>
                        <th>Amount</th>
                        <th>Expense Date</th>
                        <th>Method</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tfoot>
                    <tr>
                        <th>Category</th>
                        <th>Name</th>
                        <th>Payee</th>
                        <th>Amount</th>
                        <th>Expense Date</th>
                        <th>Method</th>
                        <th>Action</th>
                    </tr>
                </tfoot>
                <tbody>
                    {% for i in expense %}
                        <tr>
                            <td>{{ i.category_name }}</td>
                            <td>{{ i.name }}</td>
                            <td>{{ i.payee }}</td>
                            <td>{{ i.amount }}</td>
                            <td>{{ i.expense_date }}</td>
                            <td>{{ i.payment_method }}</td>
                            <td>
                                <a href="{{ url_for('expense.expense_details_page', expense_id=i.id) }}" class="btn btn-sm btn-info" title="View expense details">
                                    <i class="bi bi-eye"></i> View
                                </a>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
