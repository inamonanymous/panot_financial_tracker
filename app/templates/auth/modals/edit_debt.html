<div class="modal fade" id="editDebtModal" tabindex="-1" role="dialog" aria-labelledby="editDebtModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editDebtModalLabel">Edit Debt</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <form method="POST" action="" id="editDebtForm" novalidate>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="edit_debt_name" class="font-weight-bold">Debt Name</label>
                        <input type="text" class="form-control" id="edit_debt_name" name="name" placeholder="Car Loan, Personal Loan, etc.">
                    </div>

                    <div class="form-group">
                        <label for="edit_debt_lender" class="font-weight-bold">Lender</label>
                        <input type="text" class="form-control" id="edit_debt_lender" name="lender" placeholder="Bank name, Person, Company">
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="edit_debt_principal" class="font-weight-bold">Principal Amount</label>
                            <input type="number" step="0.01" min="100" class="form-control" id="edit_debt_principal" name="principal" placeholder="100.00">
                        </div>
                        <div class="form-group col-md-6">
                            <label for="edit_debt_interest_rate" class="font-weight-bold">Interest Rate (%)</label>
                            <input type="number" step="0.01" min="0" max="6" class="form-control" id="edit_debt_interest_rate" name="interest_rate" placeholder="0.00">
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="editDebtSubmit">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
