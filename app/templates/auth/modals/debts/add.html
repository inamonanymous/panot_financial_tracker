<div class="modal fade" id="addDebtModal" tabindex="-1" role="dialog" aria-labelledby="addDebtModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addDebtModalLabel">Add Debt</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <form method="POST" action="{{ url_for('debts.insert_debt_route') }}" novalidate>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="input_debt_name" class="font-weight-bold">Debt Name</label>
                        <input type="text" class="form-control" id="input_debt_name" name="name" placeholder="Car Loan, Personal Loan, etc." required>
                    </div>

                    <div class="form-group">
                        <label for="input_lender" class="font-weight-bold">Lender</label>
                        <input type="text" class="form-control" id="input_lender" name="lender" placeholder="Bank name, Person, Company" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="input_principal" class="font-weight-bold">Principal Amount</label>
                            <input type="number" step="0.01" min="100" class="form-control" id="input_principal" name="principal" placeholder="100.00" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="input_interest_rate" class="font-weight-bold">Interest Rate (%)</label>
                            <input type="number" step="0.01" min="0" max="6" class="form-control" id="input_interest_rate" name="interest_rate" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="input_start_date" class="font-weight-bold">Start Date</label>
                            <input type="date" class="form-control" id="input_start_date" name="start_date" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="input_due_date" class="font-weight-bold">Due Date</label>
                            <input type="date" class="form-control" id="input_due_date" name="due_date" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="input_status" class="font-weight-bold">Status</label>
                        <select class="form-control" id="input_status" name="status" required>
                            <option value="active">Active</option>
                            <option value="closed">Closed</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Debt</button>
                </div>
            </form>
        </div>
    </div>
</div>
