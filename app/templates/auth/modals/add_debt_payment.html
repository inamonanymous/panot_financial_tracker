<div class="modal fade" id="addDebtPaymentModal" tabindex="-1" role="dialog" aria-labelledby="addDebtPaymentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addDebtPaymentModalLabel">Add Debt Payment</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <form method="POST" action="{{ url_for('debts.add_debt_payment_route', debt_id=debt.id) }}" novalidate>
                <div class="modal-body">
                    <div class="alert alert-info" role="alert">
                        <i class="bi bi-info-circle"></i> Adding a payment will create an expense record and link it to this debt.
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="input_payment_amount" class="font-weight-bold">Payment Amount</label>
                            <input type="number" step="0.01" min="0.01" class="form-control" id="input_payment_amount" name="amount" placeholder="0.00" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="input_payment_date" class="font-weight-bold">Payment Date</label>
                            <input type="date" class="form-control" id="input_payment_date" name="payment_date" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="input_payment_method" class="font-weight-bold">Payment Method</label>
                        <select class="form-control" id="input_payment_method" name="payment_method" required>
                            <option value="cash">Cash</option>
                            <option value="gcash">G-Cash</option>
                            <option value="bank">Bank</option>
                            <option value="card">Card</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="form-group mb-0">
                        <label for="input_payment_remarks" class="font-weight-bold">Remarks</label>
                        <textarea class="form-control" id="input_payment_remarks" name="remarks" rows="3" placeholder="Optional notes about this payment"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">Add Payment</button>
                </div>
            </form>
        </div>
    </div>
</div>
